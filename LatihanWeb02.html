<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Form dengan Placeholder</title>
  <style>
    .form-container {
      border: 2px solid #888;
      width: 450px;
      padding: 16px 16px 8px 16px;
      margin: 40px auto;
      box-sizing: border-box;
      overflow: auto;
    }
    table {
      width: 100%;
    }
    td {
      padding: 8px 4px 8px 0;
      vertical-align: top;
    }
    td.addres{
        vertical-align: middle;
    }
    label {
      display: inline-block;
      width: 65px;
      font-weight: normal;
      white-space: nowrap;
    }
    input[type="text"], input[type="email"] {
      width: 90%;
      padding: 2px 4px;
      box-sizing: border-box;
    }
    textarea {
      width: 90%;
      height: 70px;
      resize: vertical;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <form>
      <table>
        <tr>
          <td><label for="name">Name:</label></td>
          <td><input type="text" id="name" name="name" placeholder="you name here" /></td>
        </tr>
        <tr>
          <td><label for="email">Email:</label></td>
          <td><input type="email" id="email" name="email" placeholder="your email here" /></td>
        </tr>
        <tr>
          <td class="addres"><label for="address">Address:</label></td>
          <td>
            <textarea id="address" name="address" placeholder="25 Nowhere Street&#10;Somewhere&#10;Not Here&#10;Y2K 5RU"></textarea>
          </td>
        </tr>
        <tr>
          <td><label for="postcode">Postcode:</label></td>
          <td><input type="text" id="postcode" name="postcode" placeholder="postal code" /></td>
        </tr>
      </table>
    </form>
  </div>
</body>
</html>
